{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>Add Payroll</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Employee ID</label>
            <input type="text" name="emp_id" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Employee Name</label>
            <input type="text" name="emp_name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Basic Salary</label>
            <input type="number" name="basic_salary" class="form-control" required>
        </div>

        <div class="mb-3">
            <label>Bonus</label>
            <input type="number" name="bonus" class="form-control" value="0">
        </div>

        <div class="mb-3">
            <label>Deduction</label>
            <input type="number" name="deduction" class="form-control" value="0">
        </div>

        <div class="mb-3">
            <label>Month</label>
            <input type="month" name="month" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-success">
            Save Payroll
        </button>

        <a href="{% url 'payroll_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
