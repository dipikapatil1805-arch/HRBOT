{% extends "base.html" %}

{% block content %}

<div class="container mt-4">
    <h2>Edit Payroll</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label>Employee ID</label>
            <input type="text" name="emp_id" class="form-control"
                   value="{{ payroll.emp_id }}" required>
        </div>

        <div class="mb-3">
            <label>Employee Name</label>
            <input type="text" name="emp_name" class="form-control"
                   value="{{ payroll.emp_name }}" required>
        </div>

        <div class="mb-3">
            <label>Basic Salary</label>
            <input type="number" name="basic_salary" class="form-control"
                   value="{{ payroll.basic_salary }}" required>
        </div>

        <div class="mb-3">
            <label>Bonus</label>
            <input type="number" name="bonus" class="form-control"
                   value="{{ payroll.bonus }}">
        </div>

        <div class="mb-3">
            <label>Deduction</label>
            <input type="number" name="deduction" class="form-control"
                   value="{{ payroll.deduction }}">
        </div>

        <div class="mb-3">
            <label>Net Salary</label>
            <input type="number" name="net_salary" class="form-control"
                   value="{{ payroll.net_salary }}" required>
        </div>

        <div class="mb-3">
            <label>Month</label>
            <input type="month" name="month" class="form-control"
                   value="{{ payroll.month }}" required>
        </div>

        <button class="btn btn-primary">
            Update Payroll
        </button>

        <a href="{% url 'payroll_list' %}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
