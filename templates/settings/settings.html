{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h2 class="mb-4">
        <i class="bi bi-gear-fill"></i>
        Settings
    </h2>

    <div class="row">

        <!-- Company Information -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    Company Information
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" class="form-control" value="HRBot Pvt Ltd">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company Email</label>
                        <input type="email" class="form-control" value="hr@hrbot.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Company Address</label>
                        <textarea class="form-control" rows="3">Pune, Maharashtra</textarea>
                    </div>

                </div>
            </div>
        </div>

        <!-- Admin Profile -->
        <div class="col-md-6 mb-4">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    Admin Profile
                </div>

                <div class="card-body">

                    <div class="mb-3">
                        <label class="form-label">Admin Name</label>
                        <input type="text" class="form-control" value="Administrator">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" value="admin@hrbot.com">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" value="+91 9876543210">
                    </div>

                </div>
            </div>
        </div>

    </div>

    <div class="card shadow mt-3">

        <div class="card-header bg-dark text-white">
            Preferences
        </div>

        <div class="card-body">

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">
                    Enable Email Notifications
                </label>
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" checked>
                <label class="form-check-label">
                    Dark Mode
                </label>
            </div>

            <button class="btn btn-primary">
                Save Settings
            </button>

        </div>

    </div>

</div>

{% endblock %}
